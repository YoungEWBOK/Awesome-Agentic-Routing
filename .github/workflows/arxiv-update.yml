name: Biweekly arXiv update

on:
  schedule:
    # Friday 09:17 Asia/Shanghai; the script runs a search every 14 days.
    - cron: '17 1 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check updater behavior
        run: python -m unittest discover -s tests -v
      - name: Search when due
        if: github.event_name == 'schedule'
        run: python scripts/update_arxiv.py --scheduled
      - name: Search on manual request
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_arxiv.py
      - name: Publish updated reading inbox
        shell: bash
        run: |
          git add data/candidates.json data/update_state.json RECENT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh arXiv reading candidates'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
